# Préparation OSRM, une fois par extrait (ex. bretagne-latest, france-latest) :
#   curl -L -o data/osrm/<extrait>.osm.pbf https://download.geofabrik.de/europe/france/<extrait>.osm.pbf
#   Gros extraits (France) : ne garder que le réseau routier, sinon osrm-extract dépasse 18 Go de RAM.
#   docker run --rm -v "$PWD/data/osrm:/data" iboates/osmium tags-filter /data/<extrait>.osm.pbf \
#     w/highway w/route=ferry,shuttle_train r/type=restriction -o /data/<extrait>-routes.osm.pbf
#   docker run --rm -v "$PWD/data/osrm:/data" ghcr.io/project-osrm/osrm-backend osrm-extract -p /opt/car.lua /data/<extrait>.osm.pbf
#   docker run --rm -v "$PWD/data/osrm:/data" ghcr.io/project-osrm/osrm-backend osrm-partition /data/<extrait>.osrm
#   docker run --rm -v "$PWD/data/osrm:/data" ghcr.io/project-osrm/osrm-backend osrm-customize /data/<extrait>.osrm
# Puis : OSRM_EXTRACT=<extrait> docker compose up -d
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: >
      osrm-routed --algorithm mld --max-table-size 10000 --max-viaroute-size 10000
      /data/${OSRM_EXTRACT:-france-routes}.osrm
    volumes:
      - ./data/osrm:/data
    ports:
      - '5000:5000'
  # Même chose en profil piéton (osrm-extract -p /opt/foot.lua), pour les runs `"profile": "foot"`.
  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: >
      osrm-routed --algorithm mld --max-table-size 10000 --max-viaroute-size 10000
      /data/${OSRM_FOOT_EXTRACT:-lyon-grenoble-foot}.osrm
    volumes:
      - ./data/osrm:/data
    ports:
      - '5001:5000'
  # Réseau ferré, profil maison profiles/train.lua, pour les runs `"profile": "train"` :
  #   osmium tags-filter france-latest.osm.pbf w/railway=rail,narrow_gauge -o france-rail.osm.pbf
  #   osrm-extract -p /profiles/train.lua --small-component-size 1 /data/france-rail.osm.pbf (./profiles sur /profiles)
  #   --small-component-size 1 : une ligne isolée (voie métrique…) reste à part, ses gares sont signalées
  #   injoignables au lieu d'être accrochées au grand réseau à 20 km de là.
  osrm-train:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: >
      osrm-routed --algorithm mld --max-table-size 10000 --max-viaroute-size 10000
      /data/${OSRM_TRAIN_EXTRACT:-france-rail}.osrm
    volumes:
      - ./data/osrm:/data
    ports:
      - '5002:5000'
  # VROOM ne reçoit que des matrices (D-4) : il n'appelle jamais OSRM.
  vroom:
    image: ghcr.io/vroom-project/vroom-docker:latest
    volumes:
      - ./vroom:/conf
    ports:
      - '3000:3000'
