# Studio dijkstravel auto-hébergé : `deploy/build.sh` puis
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
# Tout se règle dans deploy/.env (voir .env.example). Les graphes OSRM se préparent comme pour la CLI
# (voir docker-compose.yml à la racine) ; chaque profil OSRM ne démarre que s'il est dans COMPOSE_PROFILES.

x-restart: &restart
  restart: ${RESTART_POLICY:-no}

x-studio: &studio
  <<: *restart
  image: dijkstravel-studio:${STUDIO_TAG:-local}
  environment: &studio-env
    DATABASE_URL: postgres://${POSTGRES_USER:-dijkstravel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dijkstravel}
    S3_ENDPOINT: http://garage:3900
    S3_REGION: garage
    S3_BUCKET: ${S3_BUCKET:-dijkstravel}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY}
    OSRM_URL: ${OSRM_URL:-http://osrm-car:5000}
    OSRM_FOOT_URL: ${OSRM_FOOT_URL:-http://osrm-foot:5000}
    OSRM_TRAIN_URL: ${OSRM_TRAIN_URL:-http://osrm-train:5000}
    VROOM_URL: ${VROOM_URL:-http://vroom:3000}
    OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
    RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
  extra_hosts:
    # Pour viser des services de l'hôte (OSRM du compose de dev) : OSRM_URL=http://host.docker.internal:5000.
    - host.docker.internal:host-gateway
  depends_on:
    postgres:
      condition: service_healthy
    garage:
      condition: service_started

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dijkstravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dijkstravel}
    volumes:
      # Volume nommé par défaut : Postgres exige un dossier en 0700, impossible sur NTFS.
      - ${PG_DATA_DIR:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dijkstravel} -d ${POSTGRES_DB:-dijkstravel}']
      interval: 2s
      timeout: 3s
      retries: 30

  garage:
    <<: *restart
    image: dxflrs/garage:${GARAGE_TAG:-v2.1.0}
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      # Métadonnées (sqlite) sur un disque Linux, blocs de données sur DATA.
      - ${GARAGE_META_DIR:-garage-meta}:/var/lib/garage/meta
      - ${GARAGE_DATA_DIR:?GARAGE_DATA_DIR}:/var/lib/garage/data

  studio-api:
    <<: *studio
    command: ['api']
    environment:
      <<: *studio-env
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN}
      GARAGE_CAPACITY_BYTES: ${GARAGE_CAPACITY_BYTES:-200000000000}
      IMPORT_DIR: /seed
      IMPORT_OUT_DIR: /seed-out
    volumes:
      - ${IMPORT_RUNS_DIR:-../runs}:/seed/runs:ro
      - ${IMPORT_THEMES_DIR:-../themes}:/seed/themes:ro
      - ${IMPORT_OUT_DIR:-../data/out}:/seed-out:ro
      - ${CACHE_DIR:?CACHE_DIR}:/cache
    ports:
      - ${STUDIO_BIND:-127.0.0.1}:${STUDIO_PORT:-8080}:8080

  studio-worker:
    <<: *studio
    command: ['worker']
    environment:
      <<: *studio-env
      WORKER_NAME: ${WORKER_NAME:-worker}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      RENDER_THREADS: ${RENDER_THREADS:-0}
    volumes:
      - ${CACHE_DIR:?CACHE_DIR}:/cache
      - ${SCRATCH_DIR:-work}:/work
    cpus: ${WORKER_CPUS:-5}
    mem_limit: ${WORKER_MEMORY:-6g}

  vroom:
    <<: *restart
    image: ghcr.io/vroom-project/vroom-docker:latest
    volumes:
      - ./vroom:/conf

  osrm-car:
    <<: *restart
    profiles: [car]
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld --max-table-size 10000 --max-viaroute-size 10000 /data/${OSRM_CAR_GRAPH:-france-routes}.osrm
    volumes:
      - ${OSRM_DIR:?OSRM_DIR}:/data:ro

  osrm-foot:
    <<: *restart
    profiles: [foot]
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld --max-table-size 10000 --max-viaroute-size 10000 /data/${OSRM_FOOT_GRAPH:-lyon-grenoble-foot}.osrm
    volumes:
      - ${OSRM_DIR:?OSRM_DIR}:/data:ro

  osrm-train:
    <<: *restart
    profiles: [train]
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld --max-table-size 10000 --max-viaroute-size 10000 /data/${OSRM_TRAIN_GRAPH:-france-rail}.osrm
    volumes:
      - ${OSRM_DIR:?OSRM_DIR}:/data:ro

volumes:
  pgdata:
  garage-meta:
  work:
