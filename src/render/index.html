<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>dijkstravel</title>
    <link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
    <script type="importmap">
      { "imports": { "maplibre-gl": "/node_modules/maplibre-gl/dist/maplibre-gl.mjs" } }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Les polices proposées par l'éditeur (HUD_FONTS dans src/theme.ts). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700..900&family=Quicksand:wght@700&family=Fredoka:wght@700&family=Baloo+2:wght@700..800&family=Poppins:wght@700;800;900&family=Comfortaa:wght@700&display=block"
      rel="stylesheet"
    />
    <style>
      /* Valeurs par défaut ; le thème (src/theme.ts) les remplace au chargement. */
      :root {
        --hud-font: 'Nunito';
        --hud-size: 30px;
        --hud-bg: #260c28;
        --hud-text: #ffffff;
        --hud-title: #f5a3c7;
        --hud-distance: #e0679f;
        --pill-from: #702963;
        --pill-to: #e0679f;
        --pill-text: #ffffff;
      }
      .off {
        display: none !important;
      }
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--hud-font), sans-serif;
      }
      #hud {
        position: absolute;
        top: 3%;
        right: 3%;
        left: 3%;
        display: flex;
        flex-direction: column;
        gap: 0.35em;
        padding: 0.6em 0.8em;
        border-radius: 0.8em;
        background: color-mix(in srgb, var(--hud-bg) 72%, transparent);
        backdrop-filter: blur(6px);
        color: var(--hud-text);
        font-size: var(--hud-size);
        font-weight: 800;
      }
      #title {
        color: var(--hud-title);
        font-size: 0.6em;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #stats {
        display: flex;
        align-items: baseline;
        gap: 0.8em;
      }
      #distance {
        color: var(--hud-distance);
        font-size: 1.5em;
        font-weight: 900;
      }
      #total-distance,
      #count {
        font-size: 0.8em;
        opacity: 0.85;
      }
      /* Une seule ligne, quelle que soit la longueur du nom : la carte garde sa hauteur
         (page.ts réduit la police des noms trop longs pour qu'ils tiennent). */
      #last-stop {
        box-sizing: border-box;
        width: fit-content;
        max-width: 100%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        padding: 0.2em 0.7em;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--pill-from), var(--pill-to));
        color: var(--pill-text);
      }
      #stop-row {
        display: flex;
        align-items: center;
        gap: 0.4em;
        min-width: 0;
      }
      /* Boîte de taille fixe, même sans image pour ce lieu : la carte ne change pas de hauteur. */
      #stop-image {
        flex: none;
        width: 1.9em;
        height: 1.9em;
        object-fit: contain;
      }
      #last-stop {
        min-width: 0;
      }
      /* Masqués sans être retirés : la carte garde la même taille pendant l'intro. */
      body[data-phase='intro'] #stats,
      body[data-phase='intro'] #stop-row {
        visibility: hidden;
      }
      #attribution {
        position: absolute;
        left: 1.5%;
        bottom: 1%;
        color: rgb(255 255 255 / 70%);
        font-size: 12px;
        font-weight: 700;
        text-shadow: 0 0 3px rgb(0 0 0 / 80%);
      }
      /* Portrait (Reels, TikTok, Shorts) : sous la bande que couvre l'interface de l'appli en haut. */
      @media (orientation: portrait) {
        #hud {
          top: 9%;
          right: 5%;
          left: 5%;
        }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="hud">
      <div id="title"></div>
      <div id="stats">
        <div id="counter"><span id="distance"></span> <span id="total-distance"></span></div>
        <div id="count"></div>
      </div>
      <div id="stop-row">
        <img id="stop-image" alt="" />
        <div id="last-stop"></div>
      </div>
    </div>
    <div id="attribution">
      © OpenStreetMap contributors · © OpenMapTiles · OpenFreeMap · <span id="imagery-credit"></span> · Mapzen Terrain
      Tiles
    </div>
    <script type="module" src="/src/render/page.ts"></script>
  </body>
</html>
