[package]
name = "dijkstravel-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dijkstravel-core.workspace = true
dijkstravel-render.workspace = true
dijkstravel-solve.workspace = true
dijkstravel-sources.workspace = true
futures = "0.3.34"
object_store = { version = "0.14.2", features = ["aws"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq.workspace = true
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
